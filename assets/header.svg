<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient: Midnight Obsidian to Deep Navy -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050916" />
      <stop offset="50%" stop-color="#10182B" />
      <stop offset="100%" stop-color="#050916" />
    </linearGradient>

    <!-- Electric Cyan to Royal Violet Gradient for Accents -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00D6A0" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26334A" />
      <stop offset="35%" stop-color="#00C8FF" />
      <stop offset="65%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#26334A" />
    </linearGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="45%" stop-color="#F4F7FB" />
      <stop offset="70%" stop-color="#F4F7FB" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Subtle Ambient Blur Filter -->
    <filter id="ambient-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <filter id="ambient-violet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00C8FF" stroke-width="0.75" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #00D6A0;
    }
    .pulse-dot {
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.4; r: 3.5px; }
      50% { opacity: 1; r: 5px; }
      100% { opacity: 0.4; r: 3.5px; }
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="220" rx="12" fill="url(#bg-grad)" />

  <!-- Ambient Color Radiance (Cyan Left, Violet Right) -->
  <circle cx="160" cy="80" r="95" fill="#00C8FF" opacity="0.12" filter="url(#ambient-cyan)" />
  <circle cx="740" cy="130" r="100" fill="#A855F7" opacity="0.10" filter="url(#ambient-violet)" />
  <circle cx="450" cy="180" r="80" fill="#00D6A0" opacity="0.08" filter="url(#ambient-cyan)" />

  <!-- Subtle Precision Grid -->
  <rect width="900" height="220" rx="12" fill="url(#tech-grid)" />

  <!-- Refined Outer Border -->
  <rect x="1.5" y="1.5" width="897" height="217" rx="11" fill="none" stroke="url(#border-grad)" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Architectural Corner Details -->
  <!-- Top-Left -->
  <path d="M 10 26 L 10 12 L 26 12" stroke="#00C8FF" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Top-Right -->
  <path d="M 890 26 L 890 12 L 874 12" stroke="#A855F7" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Bottom-Left -->
  <path d="M 10 194 L 10 208 L 26 208" stroke="#00D6A0" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Bottom-Right -->
  <path d="M 890 194 L 890 208 L 874 208" stroke="#00C8FF" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Status Pill Indicator (Emerald Teal Accent) -->
  <g transform="translate(290, 22)">
    <rect width="320" height="26" rx="13" fill="#111827" stroke="#26334A" stroke-width="1" />
    <circle cx="18" cy="13" r="4.5" fill="#00D6A0" class="pulse-dot" />
    <text x="170" y="17" text-anchor="middle" class="badge-text">BUILDING RELIABLE SOFTWARE &amp; SYSTEMS</text>
  </g>

  <!-- Main Engineer Name Header -->
  <text x="450" y="103" text-anchor="middle" class="title-text" fill="url(#name-grad)">
    SURYA NARAYANAN P
  </text>

  <!-- Professional Subtitle -->
  <text x="450" y="139" text-anchor="middle" class="subtitle-text">
    <tspan fill="#00C8FF">SOFTWARE DEVELOPMENT</tspan>
    <tspan fill="#7E8BA3"> &#8226; </tspan>
    <tspan fill="#A855F7">DATA ENGINEERING</tspan>
    <tspan fill="#7E8BA3"> &#8226; </tspan>
    <tspan fill="#00D6A0">AUTOMATION &amp; IOT</tspan>
  </text>

  <!-- Sleek Architectural Divider -->
  <g transform="translate(0, 158)">
    <line x1="220" y1="0" x2="420" y2="0" stroke="url(#border-grad)" stroke-width="1.2" stroke-opacity="0.7" />
    <polygon points="450,-4 454,0 450,4 446,0" fill="#00C8FF" />
    <line x1="480" y1="0" x2="680" y2="0" stroke="url(#border-grad)" stroke-width="1.2" stroke-opacity="0.7" />
  </g>

  <!-- Secondary Metadata Line -->
  <g transform="translate(450, 190)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#A8B3C7" letter-spacing="1.5">
      <tspan fill="#00C8FF">&lt;/&gt;</tspan> BUILDING RELIABLE SOFTWARE AND INTELLIGENT SYSTEMS
    </text>
  </g>
</svg>