<svg xmlns="http://www.w3.org/2000/svg" width="188" height="38" viewBox="0 0 188 38">
  <defs>
    <style>
      .btn { transition: all 0.25s ease-in-out; }
      .btn:hover .bg { fill: #152238; stroke: #00C8FF; stroke-width: 1.5px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #F4F7FB; }
      .dot { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #7E8BA3; }
      .action { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #00C8FF; }
      .arrow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #00C8FF; }
    </style>
  </defs>
  <g class="btn">
    <!-- Capsule Background -->
    <rect class="bg" x="1" y="1" width="186" height="36" rx="18" fill="#10182B" stroke="#00C8FF" stroke-width="1.2" stroke-opacity="0.5" />
    
    <!-- LinkedIn Icon (16x16) -->
    <g transform="translate(16, 11)">
      <path fill="#00C8FF" d="M14.82 0H1.18A1.17 1.17 0 0 0 0 1.16v13.68A1.17 1.17 0 0 0 1.18 16h13.64A1.18 1.18 0 0 0 16 14.84V1.16A1.18 1.18 0 0 0 14.82 0zM4.74 13.63H2.37V5.99h2.37v7.64zM3.56 4.95a1.37 1.37 0 1 1 0-2.74 1.37 1.37 0 0 1 0 2.74zm10.07 8.68h-2.37V9.92c0-.89-.02-2.03-1.24-2.03-1.24 0-1.43.97-1.43 1.97v3.77H6.22V5.99h2.28v1.05h.03c.32-.6 1.09-1.24 2.25-1.24 2.41 0 2.85 1.59 2.85 3.65v4.18z"/>
    </g>

    <!-- Typography -->
    <text x="40" y="23.5" class="label">LinkedIn</text>
    <text x="94" y="23.5" class="dot">·</text>
    <text x="105" y="23.5" class="action">Connect</text>
    <text x="160" y="23.5" class="arrow">↗</text>
