<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 120" width="100%" height="120">
  <defs>
    <!-- Background Gradient: Midnight Obsidian to Deep Navy -->
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050916" />
      <stop offset="50%" stop-color="#10182B" />
      <stop offset="100%" stop-color="#050916" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="q-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26334A" />
      <stop offset="30%" stop-color="#00C8FF" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#26334A" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="820" height="120" rx="10" fill="url(#q-bg)" stroke="url(#q-border)" stroke-width="1.2" />

  <!-- Corner Cyber Accents -->
  <path d="M 8 20 L 8 8 L 20 8" stroke="#00C8FF" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 812 20 L 812 8 L 800 8" stroke="#A855F7" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 8 100 L 8 112 L 20 112" stroke="#00D6A0" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 812 100 L 812 112 L 800 112" stroke="#00C8FF" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Quote Mark (Electric Cyan) -->
  <text x="32" y="56" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#00C8FF" opacity="0.9">&#8220;</text>

  <!-- Quote Text Line -->
  <text x="64" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-style="italic" font-weight="500" fill="#F4F7FB">
    &#8220;Code is the modern canvas where logic and art collide &#8212; sculpting ideas into living digital reality.&#8221;
  </text>

  <!-- Attribution Line (Emerald Teal) -->
  <text x="760" y="88" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00D6A0" letter-spacing="1">
    &#8212; The Art of Programming
  </text>
</svg>